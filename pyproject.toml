[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "namekit"
version = "0.1.1"
description = "Deterministic pop-culture name generator from string keys."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bryan Viggiano", email = "viggiano@stanford.edu" }]
keywords = ["names", "deterministic", "hashing", "fictional", "characters", "run-name"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "black", "isort"]

[project.urls]
Homepage = "https://github.com/bviggiano/namekit"
Issues = "https://github.com/bviggiano/namekit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/namekit"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
